# Cloudflare Pages configuration
# Build generates the static site; output is served from the repo root.
# Uses a pre-bundled Node entry (scripts-dist/generate.js) so no bun is required
# on the Pages build image. Regenerate the bundle locally after editing scripts/:
#   bun build scripts/generate.ts --target=node --format=esm --outdir=scripts-dist

name = "jvm-tools"
compatibility_date = "2026-08-07"
pages_build_output_dir = "."

[build]
command = "node scripts-dist/generate.js"
